[package]
name = "mother"
version = "0.1.0"
edition = "2021"
authors = ["7ANG0N1N3"]
description = "MU/TH/UR 6000 — Network Reconnaissance Suite"

[[bin]]
name = "mother"
path = "src/main.rs"

[dependencies]
ratatui          = "0.29"
crossterm        = { version = "0.28", features = ["event-stream"] }
tokio            = { version = "1",    features = ["full"] }
anyhow           = "1"
chrono           = { version = "0.4",  features = ["clock"] }
futures          = "0.3"
rodio            = "0.22"
surge-ping       = "0.8"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
socket2          = { version = "0.5",  features = ["all"] }
pnet             = "0.35"
ipnetwork        = "0.20"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
